dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://api.xposed.info/"
            metadataSources {
                mavenPom()
                artifact()
            }
        }
    }
}

rootProject.name = "YuukiPS"
include ':app'
